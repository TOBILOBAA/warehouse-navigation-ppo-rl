env:
  width: 10
  height: 10
  max_steps: 80
  start_pos: [1, 5]
  start_heading: 1
  target_pos: [8, 5]

reward:
  target: 10.0
  collision: -0.5
  blocked_forward: -0.2
  failed_jump: -0.3
  step_penalty: -0.01

ppo:
  policy: MlpPolicy
  total_timesteps: 50000
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 64
  gamma: 0.99

eval:
  episodes: 20
  deterministic: true
