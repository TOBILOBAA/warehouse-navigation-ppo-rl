env:
  width: 14
  height: 12
  max_steps: 160
  start_pos: [1, 6]
  start_heading: 1
  stagnation_grace_steps: 2
  grid_rows:
    - ". . . . . . . . . . . . . ."
    - ". . # # . . . . . . # # . ."
    - ". . # . . . . . . . . # . ."
    - ". . . . . . . . . . . . T ."
    - ". . . . # # . . . . # # . ."
    - ". . . . . # . . . . # . . ."
    - ". S . . . o . . . . o . T ."
    - ". . . . . # . . . . # . . ."
    - ". . . . # # . . . . # # . ."
    - ". . . . . . . . . . . . T ."
    - ". . # . . . . . . . . # . ."
    - ". . # # . . . . . . # # . ."

reward:
  target: 10.0
  collision: -0.5
  blocked_forward: -0.2
  failed_jump: -1.0
  step_penalty: -0.01
  stagnation: -0.05

ppo:
  policy: MlpPolicy
  total_timesteps: 120000
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 64
  gamma: 0.99

eval:
  episodes: 20
  deterministic: true
